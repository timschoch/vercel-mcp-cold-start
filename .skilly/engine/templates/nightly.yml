# Managed by skilly. The Sync writes this file from the Engine and overwrites
# a hand edit. Change .skilly/verify.json or the tier in .skilly/config.json.
#
# Product tier: the long checks that never gate a merge. Keep it off the
# required checks: a scheduled run can start late. The Engine's plan picks the
# night from the last commit and the last finished night (ADR-0004): nightly,
# nightly-scan, or stop with one nightly-stuck issue.
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC
  workflow_dispatch: {} # a manual run runs everything

permissions:
  contents: read
  actions: read # the plan reads the nightly run history
  issues: write # one open issue per check

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the budgetSeconds of the nightly stage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # @{setupNode}
      - id: plan
        run: node .skilly/engine/verify/plan.mjs nightly >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - if: steps.plan.outputs.stage != 'stop'
        run: '@{install}'
      # Every browser here, unlike the PR gate's single chromium.
      - if: contains(fromJSON(steps.plan.outputs.toolchains), 'playwright')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('@{lockfile}') }}
      - if: contains(fromJSON(steps.plan.outputs.toolchains), 'playwright')
        run: '@{exec} playwright install --with-deps'
      # verify runs every step, also after a red one, and writes each result.
      - if: steps.plan.outputs.stage != 'stop'
        run: node .skilly/engine/verify/verify.mjs ${{ steps.plan.outputs.stage }} --results "$RUNNER_TEMP/verify-results.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Nobody watches a scheduled run, so a red check opens its issue.
      - if: ${{ !cancelled() && steps.plan.outputs.stage != 'stop' }}
        run: node .skilly/engine/verify/nightly-report.mjs "$RUNNER_TEMP/verify-results.json"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
