# Not a Managed file: the action refs of the steps the Sync writes in place of
# `# @{setupNode}` in ci.yml and nightly.yml. They live in a template, so the
# Hub's Dependabot bumps them like the refs in the other templates.
jobs:
  setup:
    steps:
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
