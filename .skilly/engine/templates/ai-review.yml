# Managed by skilly. The Sync writes this file from the Engine and overwrites
# a hand edit. Change .skilly/verify.json or the tier in .skilly/config.json.
#
# On-demand review, tool tier and up: a /ai-review comment runs the repo's own
# code-review skill on the runner. Never automatic on push: most PRs here are
# Sync PRs, and a review of those is waste. Billed to the OAuth subscription in
# the CLAUDE_CODE_OAUTH_TOKEN secret.
name: AI review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  ai-review:
    # Cheap gate before the checkout: the action itself re-checks trigger_phrase.
    if: contains(github.event.comment.body, '/ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '/ai-review'
          prompt: |
            Review this pull request by running the repo's own code-review skill:
            read .agents/skills/code-review/SKILL.md and follow it.
            Post each finding as an inline comment via
            mcp__github_inline_comment__create_inline_comment with confirmed: true.
            Do not approve, do not request changes, do not push commits. Report only.
          # No --bare: it skips the skills and the CLAUDE.md this review reads.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr:*),Read,Grep,Glob"'
